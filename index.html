<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Propuesta visual · Sublimación Durán</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#24104f;background:#f7f8fc}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0%,#ffd52a 0 10%,transparent 28%),radial-gradient(circle at 95% 10%,#18bdb7 0 8%,transparent 26%),#f7f8fc}
    .proposal{width:min(1480px,calc(100% - 20px));margin:10px auto 24px;background:#fff;border:1px solid #e4e7f0;border-radius:28px;box-shadow:0 24px 70px #24104f24;overflow:hidden}
    .notice{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 22px;background:linear-gradient(100deg,#24104f,#ef347e);color:#fff;font-weight:800}
    .responsive-note{padding:12px 22px;background:#eefdf9;color:#176b68;border-bottom:1px solid #c9f0e9;font-size:.92rem;font-weight:750;text-align:center}
    .notice span{opacity:.85;font-size:.9rem}.tag{background:#ffc928;color:#24104f;border-radius:999px;padding:8px 13px;font-size:.8rem;white-space:nowrap}
    iframe{display:block;width:100%;height:calc(100vh - 74px);min-height:720px;border:0;background:#fff}
    @media(max-width:600px){.proposal{width:100%;margin:0;border-radius:0}.notice{padding:13px 16px}.notice span{display:none}iframe{height:calc(100vh - 62px);min-height:680px}}
  </style>
</head>
<body><main class="proposal"><div class="notice"><div>Propuesta visual · Sublimación Durán <span>colores vivos, efectos suaves y diseño limpio</span></div><div class="tag">Sitio publicado</div></div><div class="responsive-note">Diseño multiplataforma · se adapta a celulares verticales y horizontales, tabletas y computadoras.</div><iframe src="propuesta-3.html" title="Vista previa de la página 3"></iframe></main></body>
</html>
